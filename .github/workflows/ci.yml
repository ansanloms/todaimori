name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
defaults:
  run:
    working-directory: docs/api
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: docs/api/.node-version
          cache: npm
          cache-dependency-path: docs/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: docs/api/.node-version
          cache: npm
          cache-dependency-path: docs/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: docs/api/.node-version
          cache: npm
          cache-dependency-path: docs/api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
