version: 2
updates:
  # zizmor の dependabot-cooldown を通すため、cooldown を明示する。
  # 値は .npmrc と docs/api/.npmrc の min-release-age (7 日) と揃える。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    # 0.0.0-next-* を固定している (TypeScript 7 に対応した版)。安定版への更新は TS 7 非対応に戻る。
    ignore:
      - dependency-name: "@hey-api/openapi-ts"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/docs/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # .npmrc は github-actions に効かないので、こちらは cooldown を明示する。
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
