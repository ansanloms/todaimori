type: object
description:
  $ref: "./descriptions/RequestPutSchedulersId.md"
additionalProperties: false
required:
  - type
  - input
  - schedule
properties:
  type:
    $ref: ./EnumSchedulerType.yaml
  input:
    type: string
    minLength: 1
    pattern: \S
    description:
      $ref: "./descriptions/SchedulerInput.md"
  schedule:
    type: string
    description:
      $ref: "./descriptions/SchedulerSchedule.md"
  once:
    type: boolean
    default: false
    description: true なら、1 回実行を始めた時点で定義を消す。省くと false である。
  conversationId:
    type: string
    minLength: 1
    maxLength: 128
    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    description:
      $ref: "./descriptions/SchedulerConversationId.md"
