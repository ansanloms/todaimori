type: object
description:
  $ref: "./descriptions/Conversation.md"
required:
  - id
  - status
  - settings
properties:
  id:
    type: string
    minLength: 1
    maxLength: 128
    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
    description: "会話の ID。client が決める。server は中身を解釈しない。英数字で始まり、英数字と `.` `_` `:` `-` を使える。大文字と小文字を区別し、正規化しない。"
  status:
    $ref: ./EnumConversationStatus.yaml
  settings:
    $ref: ./ExecutionSettings.yaml
