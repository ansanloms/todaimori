get:
  operationId: getQuestions
  summary: 待っている質問の一覧。
  tags:
    - questions
  description:
    $ref: ./descriptions/getQuestions.md
  responses:
    200:
      description: 処理成功時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseGetQuestions.yaml
          examples:
            default:
              value:
                $ref: ../examples/ResponseGetQuestions/default.yaml
    401:
      description: Authorization ヘッダが無い場合と、Bearer 以外の方式の場合と、token が不正または失効している場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseFailure/unauthorized.yaml
    500:
      description: 処理失敗時。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure/default.yaml
