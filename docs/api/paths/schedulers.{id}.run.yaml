parameters:
  - $ref: ../components/parameters/SchedulerId.yaml
post:
  operationId: postSchedulersIdRun
  security:
    - bearerAuth:
        - user
  summary: 定期実行の手での実行。
  tags:
    - schedulers
  description:
    $ref: ./descriptions/postSchedulersIdRun.md
  responses:
    202:
      description: 実行を受理した場合。処理の完了は待たない。
    400:
      description: ID が不正な場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            invalidId:
              value:
                $ref: ../examples/ResponseFailure/invalidId.yaml
    401:
      description: Authorization ヘッダが無い場合と、Bearer 以外の方式の場合と、token が不正または失効している場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseFailure/unauthorized.yaml
    403:
      description: この操作を呼べない role の token で呼んだ場合。`user` の token が要る。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            forbidden:
              value:
                $ref: ../examples/ResponseFailure/forbidden.yaml
    404:
      description: 定期実行が存在しない場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            schedulerNotFound:
              value:
                $ref: ../examples/ResponseFailure/schedulerNotFound.yaml
    409:
      description: 同じ定義の前回の実行がまだ終わっていない場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            schedulerRunning:
              value:
                $ref: ../examples/ResponseFailure/schedulerRunning.yaml
    500:
      description: 処理失敗時。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure/default.yaml
