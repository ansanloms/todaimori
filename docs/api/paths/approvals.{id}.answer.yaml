parameters:
  - $ref: ../components/parameters/ApprovalId.yaml
post:
  operationId: postApprovalsIdAnswer
  security:
    - bearerAuth:
        - user
  summary: 承認への答え。
  tags:
    - approvals
  description:
    $ref: ./descriptions/postApprovalsIdAnswer.md
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RequestPostApprovalsIdAnswer.yaml
        examples:
          allow:
            value:
              $ref: ../examples/RequestPostApprovalsIdAnswer/allow.yaml
          allowAlways:
            value:
              $ref: ../examples/RequestPostApprovalsIdAnswer/allowAlways.yaml
          deny:
            value:
              $ref: ../examples/RequestPostApprovalsIdAnswer/deny.yaml
          denyWithComment:
            value:
              $ref: ../examples/RequestPostApprovalsIdAnswer/denyWithComment.yaml
  responses:
    204:
      description: 答えを受け付けた場合。
    400:
      description: body が不正な場合と、`rules` を持たない承認に `allowAlways` で答えた場合と、`deny` 以外の答えに `comment` を付けた場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            approvalInvalidAnswer:
              value:
                $ref: ../examples/ResponseFailure/approvalInvalidAnswer.yaml
            approvalRulesMissing:
              value:
                $ref: ../examples/ResponseFailure/approvalRulesMissing.yaml
            approvalCommentNotAllowed:
              value:
                $ref: ../examples/ResponseFailure/approvalCommentNotAllowed.yaml
    401:
      description: Authorization ヘッダが無い場合と、Bearer 以外の方式の場合と、token が不正または失効している場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseFailure/unauthorized.yaml
    403:
      description: この操作を呼べない role の token で呼んだ場合。`user` の token が要る。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            forbidden:
              value:
                $ref: ../examples/ResponseFailure/forbidden.yaml
    404:
      description: 承認が存在しない場合。答えが出た承認、期限が過ぎた承認、打ち切られた承認も含む。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            approvalNotFound:
              value:
                $ref: ../examples/ResponseFailure/approvalNotFound.yaml
    500:
      description: 処理失敗時。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure/default.yaml
