parameters:
  - in: path
    name: id
    required: true
    description: 会話の ID。
    schema:
      $ref: ../components/schemas/ConversationId.yaml
post:
  operationId: postConversationsIdStop
  summary: 実行の停止。
  tags:
    - conversations
  description:
    $ref: ./descriptions/postConversationsIdStop.md
  responses:
    204:
      description: 停止した場合。何も動いていなくても返す。
    400:
      description: ID が不正な場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            invalidId:
              value:
                $ref: ../examples/ResponseFailure/invalidId.yaml
    404:
      description: 会話が存在しない場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            notFound:
              value:
                $ref: ../examples/ResponseFailure/notFound.yaml
    500:
      description: 処理失敗時。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure/default.yaml
