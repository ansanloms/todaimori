parameters:
  - $ref: ../components/parameters/ConversationId.yaml
post:
  operationId: postConversationsIdStop
  security:
    - bearerAuth:
        - user
  summary: 実行の停止。
  tags:
    - conversations
  description:
    $ref: ./descriptions/postConversationsIdStop.md
  responses:
    204:
      description: 停止した場合。何も動いていなくても返す。
    400:
      description: ID が不正な場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            invalidId:
              value:
                $ref: ../examples/ResponseFailure/invalidId.yaml
    401:
      description: Authorization ヘッダが無い場合と、Bearer 以外の方式の場合と、token が不正または失効している場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseFailure/unauthorized.yaml
    403:
      description: この操作を呼べない role の token で呼んだ場合。`user` の token が要る。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            forbidden:
              value:
                $ref: ../examples/ResponseFailure/forbidden.yaml
    404:
      description: 会話が存在しない場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            conversationNotFound:
              value:
                $ref: ../examples/ResponseFailure/conversationNotFound.yaml
    500:
      description: 処理失敗時。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure/default.yaml
