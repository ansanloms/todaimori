get:
  operationId: getConnection
  summary: 接続を確認する。
  tags:
    - connection
  description:
    $ref: ./descriptions/getConnection.md
  responses:
    200:
      description: 処理成功時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseGetConnection.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseGetConnection/default.yaml
    400:
      description: Authorization ヘッダの形式が不正な場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            badRequest:
              value:
                $ref: ../examples/ResponseError/badRequest.yaml
    401:
      description: token が無い、または無効な場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseError/unauthorized.yaml
    500:
      description: 処理失敗時。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseError/internalServerError.yaml
