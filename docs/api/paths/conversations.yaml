post:
  operationId: postConversations
  summary: 会話の作成。
  tags:
    - conversations
  description:
    $ref: ./descriptions/postConversations.md
  responses:
    201:
      description: 会話を作成した場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponsePostConversations.yaml
          examples:
            created:
              value:
                $ref: ../examples/ResponsePostConversations/default.yaml
    500:
      description: 処理失敗時。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseError/default.yaml
