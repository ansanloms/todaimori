parameters:
  - $ref: ../components/parameters/ConversationId.yaml
post:
  operationId: postConversationsIdInputs
  summary: 入力の送信。
  tags:
    - conversations
  description:
    $ref: ./descriptions/postConversationsIdInputs.md
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RequestPostConversationsIdInputs.yaml
        examples:
          default:
            value:
              $ref: ../examples/RequestPostConversationsIdInputs/default.yaml
  responses:
    202:
      description: 入力を受理した場合。処理の完了は待たない。
    400:
      description: ID または body が不正な場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            inputInvalidText:
              value:
                $ref: ../examples/ResponseFailure/inputInvalidText.yaml
            invalidId:
              value:
                $ref: ../examples/ResponseFailure/invalidId.yaml
    401:
      description: Authorization ヘッダが無い場合と、Bearer 以外の方式の場合と、token が不正または失効している場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            unauthorized:
              value:
                $ref: ../examples/ResponseFailure/unauthorized.yaml
    404:
      description: 会話が存在しない場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            conversationNotFound:
              value:
                $ref: ../examples/ResponseFailure/conversationNotFound.yaml
    429:
      description: agent が送る入力がサーバの上限を超えた場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            inputRateLimited:
              value:
                $ref: ../examples/ResponseFailure/inputRateLimited.yaml
    500:
      description: 処理失敗時。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure/default.yaml
