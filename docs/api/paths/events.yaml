get:
  operationId: getEvents
  summary: イベントの購読。
  tags:
    - events
  description:
    $ref: ./descriptions/getEvents.md
  responses:
    200:
      description: 処理成功時。
      content:
        text/event-stream:
          itemSchema:
            $ref: ../components/schemas/ResponseGetEvents.yaml
          examples:
            conversationRunning:
              dataValue:
                $ref: ../examples/ResponseGetEvents/conversationRunning.yaml
              serializedValue: |+
                data: {"type":"conversation.updated","conversation":{"id":"c-0001","status":"running","settings":{"model":"opus","effort":"high"}}}

            messageCreated:
              dataValue:
                $ref: ../examples/ResponseGetEvents/messageCreated.yaml
              serializedValue: |+
                data: {"type":"message.created","conversation":{"id":"c-0001","status":"running","settings":{"model":"opus","effort":"high"}},"message":{"id":"m-0001","text":"宿まであと 40 km だ。"}}

            conversationIdle:
              dataValue:
                $ref: ../examples/ResponseGetEvents/conversationIdle.yaml
              serializedValue: |+
                data: {"type":"conversation.updated","conversation":{"id":"c-0001","status":"idle","settings":{"model":"opus","effort":"high"}}}

            failure:
              dataValue:
                $ref: ../examples/ResponseGetEvents/failure.yaml
              serializedValue: |+
                data: {"type":"failure","conversation":{"id":"c-0001","status":"running","settings":{"model":"opus","effort":"high"}},"failure":{"type":"about:blank","title":"Internal Server Error","status":500,"detail":"実行に失敗した。"}}

            conversationWaiting:
              dataValue:
                $ref: ../examples/ResponseGetEvents/conversationWaiting.yaml
              serializedValue: |+
                data: {"type":"conversation.updated","conversation":{"id":"c-0001","status":"waiting","settings":{"model":"opus","effort":"high"}}}

            approvalRequested:
              dataValue:
                $ref: ../examples/ResponseGetEvents/approvalRequested.yaml
              serializedValue: |+
                data: {"type":"approval.requested","approval":{"id":"a-0001","conversationId":"c-0001","toolName":"Bash","input":{"command":"npm run build"},"description":"ビルドを実行する。","rules":["Bash(npm run *)"],"requestedAt":"2026-11-26T09:00:00Z","expiresAt":"2026-11-26T09:10:00Z"}}

            approvalResolved:
              dataValue:
                $ref: ../examples/ResponseGetEvents/approvalResolved.yaml
              serializedValue: |+
                data: {"type":"approval.resolved","approval":{"id":"a-0001","conversationId":"c-0001","toolName":"Bash","input":{"command":"npm run build"},"description":"ビルドを実行する。","rules":["Bash(npm run *)"],"requestedAt":"2026-11-26T09:00:00Z","expiresAt":"2026-11-26T09:10:00Z"},"result":"allowed"}

    500:
      description: 処理失敗時。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure/default.yaml
