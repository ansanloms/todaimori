get:
  operationId: getEvents
  summary: イベントの購読。
  tags:
    - events
  description:
    $ref: ./descriptions/getEvents.md
  responses:
    200:
      description: 処理成功時。
      content:
        text/event-stream:
          itemSchema:
            $ref: ../components/schemas/ResponseGetEvents.yaml
          examples:
            conversationBusy:
              serializedValue: |+
                data: {"type":"conversation.updated","conversation":{"id":"c-0001","status":"busy"}}

            turnStarted:
              serializedValue: |+
                data: {"type":"turn.started","conversation":{"id":"c-0001","status":"busy"},"turn":{"id":"t-0001","status":"running"}}

            messageCreated:
              serializedValue: |+
                data: {"type":"message.created","conversation":{"id":"c-0001","status":"busy"},"turn":{"id":"t-0001","status":"running"},"message":{"id":"m-0001","text":"宿まであと 40 km だ。"}}

            turnEnded:
              serializedValue: |+
                data: {"type":"turn.ended","conversation":{"id":"c-0001","status":"busy"},"turn":{"id":"t-0001","status":"completed"}}

            conversationIdle:
              serializedValue: |+
                data: {"type":"conversation.updated","conversation":{"id":"c-0001","status":"idle"}}

    500:
      description: 処理失敗時。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseError/default.yaml
