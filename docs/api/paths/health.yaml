get:
  operationId: getHealth
  summary: 死活確認。
  tags:
    - health
  description:
    $ref: ./descriptions/getHealth.md
  responses:
    200:
      description: 処理成功時。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponseEmpty.yaml
          examples:
            succeeded:
              value:
                $ref: ../examples/ResponseEmpty/default.yaml
    500:
      description: 処理失敗時。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseError.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseError/default.yaml
