parameters:
  - $ref: ../components/parameters/ConversationId.yaml
put:
  operationId: putConversationsIdSettings
  summary: 会話の設定の置き換え。
  tags:
    - conversations
  description:
    $ref: ./descriptions/putConversationsIdSettings.md
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RequestPutConversationsIdSettings.yaml
        examples:
          normal:
            value:
              $ref: ../examples/RequestPutConversationsIdSettings/default.yaml
  responses:
    200:
      description: 設定を置き換えた場合。
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponsePutConversationsIdSettings.yaml
          examples:
            replaced:
              value:
                $ref: ../examples/ResponsePutConversationsIdSettings/default.yaml
    400:
      description: ID または設定が不正な場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            invalidId:
              value:
                $ref: ../examples/ResponseFailure/invalidId.yaml
            invalidSettings:
              value:
                $ref: ../examples/ResponseFailure/invalidSettings.yaml
    404:
      description: 会話が存在しない場合。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            notFound:
              value:
                $ref: ../examples/ResponseFailure/notFound.yaml
    500:
      description: 処理失敗時。
      content:
        application/problem+json:
          schema:
            $ref: ../components/schemas/ResponseFailure.yaml
          examples:
            processingFailed:
              value:
                $ref: ../examples/ResponseFailure/default.yaml
